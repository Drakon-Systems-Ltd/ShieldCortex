name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.4.10)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HAS_CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Wait for CI checks to complete (up to 5 minutes)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.sha;
            const maxWait = 300_000; // 5 minutes
            const interval = 15_000; // 15 seconds
            const start = Date.now();

            while (Date.now() - start < maxWait) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const buildChecks = data.check_runs.filter((run) => run.name.startsWith('build-and-test'));

              if (buildChecks.length === 0) {
                core.info(`No CI checks found yet, waiting... (${Math.round((Date.now() - start) / 1000)}s)`);
                await new Promise((r) => setTimeout(r, interval));
                continue;
              }

              const pending = buildChecks.filter((run) => run.status !== 'completed');
              if (pending.length > 0) {
                core.info(`CI still running: ${pending.map((r) => r.name).join(', ')} (${Math.round((Date.now() - start) / 1000)}s)`);
                await new Promise((r) => setTimeout(r, interval));
                continue;
              }

              // All completed — check for failures
              const failed = buildChecks.filter((run) => run.conclusion !== 'success');
              if (failed.length > 0) {
                core.setFailed(`CI checks failed: ${failed.map((r) => `${r.name}=${r.conclusion}`).join(', ')}`);
                return;
              }

              core.info(`All CI checks passed: ${buildChecks.map((r) => r.name).join(', ')}`);
              return;
            }

            core.setFailed(`Timed out waiting for CI checks after ${maxWait / 1000}s`);

      - run: npm ci
      - run: cd dashboard && npm ci
      - run: npm run build
      - run: npm test

      - name: Check if version already published
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $PACKAGE_VERSION"

          # Check if this version exists on npm
          if npm view shieldcortex@$PACKAGE_VERSION version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already exists on npm"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION not yet published"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.already_published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create the GitHub Release immediately after npm publish so a later
      # ClawHub auth failure can't skip it. (Hit this on v4.10.0 — CLAWHUB_TOKEN
      # was stale, Release step was skipped, had to be created manually.)
      - name: Create GitHub Release
        if: steps.version_check.outputs.already_published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ClawHub CLI
        if: steps.version_check.outputs.already_published == 'false' && env.HAS_CLAWHUB_TOKEN == 'true'
        run: npm install -g clawhub

      - name: Publish ShieldCortex skill to ClawHub
        if: steps.version_check.outputs.already_published == 'false' && env.HAS_CLAWHUB_TOKEN == 'true'
        continue-on-error: true
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          clawhub whoami
          clawhub publish ./skills/shieldcortex \
            --slug shieldcortex \
            --name "ShieldCortex" \
            --version "$(node -p \"require('./package.json').version\")" \
            --changelog "Auto-sync from npm publish ${GITHUB_REF_NAME}"

      - name: Skip ClawHub sync (missing token)
        if: steps.version_check.outputs.already_published == 'false' && env.HAS_CLAWHUB_TOKEN != 'true'
        run: echo "⚠️ CLAWHUB_TOKEN secret missing, skipping ClawHub auto-sync"

      - name: Skip publish (already exists)
        if: steps.version_check.outputs.already_published == 'true'
        run: echo "⚠️ Skipping publish - version already exists on npm"
