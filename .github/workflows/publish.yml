name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.4.10)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HAS_CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Wait for CI checks to complete (up to 5 minutes)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.sha;
            const maxWait = 300_000; // 5 minutes
            const interval = 15_000; // 15 seconds
            const start = Date.now();

            while (Date.now() - start < maxWait) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const buildChecks = data.check_runs.filter((run) => run.name.startsWith('build-and-test'));

              if (buildChecks.length === 0) {
                core.info(`No CI checks found yet, waiting... (${Math.round((Date.now() - start) / 1000)}s)`);
                await new Promise((r) => setTimeout(r, interval));
                continue;
              }

              const pending = buildChecks.filter((run) => run.status !== 'completed');
              if (pending.length > 0) {
                core.info(`CI still running: ${pending.map((r) => r.name).join(', ')} (${Math.round((Date.now() - start) / 1000)}s)`);
                await new Promise((r) => setTimeout(r, interval));
                continue;
              }

              // All completed — check for failures
              const failed = buildChecks.filter((run) => run.conclusion !== 'success');
              if (failed.length > 0) {
                core.setFailed(`CI checks failed: ${failed.map((r) => `${r.name}=${r.conclusion}`).join(', ')}`);
                return;
              }

              core.info(`All CI checks passed: ${buildChecks.map((r) => r.name).join(', ')}`);
              return;
            }

            core.setFailed(`Timed out waiting for CI checks after ${maxWait / 1000}s`);

      - run: npm ci
      - run: cd dashboard && npm ci
      - run: npm run build
      - run: npm test

      - name: Check if version already published
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $PACKAGE_VERSION"

          # Check if this version exists on npm
          if npm view shieldcortex@$PACKAGE_VERSION version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already exists on npm"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION not yet published"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      # Resolve the release tag for downstream steps. Push-of-tag uses the
      # tag name directly. workflow_dispatch from a branch (e.g. re-running a
      # failed publish) falls back to package.json so the GitHub Release and
      # ClawHub publish don't get a branch name like "main" as their version.
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Resolved release tag: ${TAG}"

      - name: Publish to npm
        if: steps.version_check.outputs.already_published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Plugin is a second npm package (`@drakon-systems/shieldcortex-realtime`)
      # under `plugins/openclaw/`. Historically published manually, which meant
      # the plugin repeatedly drifted behind the main package — v4.11.0 shipped
      # with plugin stuck at 4.10.7 on npm because this step didn't exist.
      # Assumes plugin version has been bumped in lockstep with the main package
      # (memory 2080: bump root, plugin package, openclaw.plugin.json, SKILL.md
      # together on every release).
      - name: Check plugin version
        id: plugin_version_check
        if: steps.version_check.outputs.already_published == 'false'
        run: |
          PLUGIN_VERSION=$(node -p "require('./plugins/openclaw/package.json').version")
          MAIN_VERSION=$(node -p "require('./package.json').version")
          echo "Plugin version: $PLUGIN_VERSION"
          echo "Main version:   $MAIN_VERSION"
          if [ "$PLUGIN_VERSION" != "$MAIN_VERSION" ]; then
            echo "::error::Plugin version ($PLUGIN_VERSION) does not match main ($MAIN_VERSION). Bump plugins/openclaw/package.json before tagging."
            exit 1
          fi
          if npm view @drakon-systems/shieldcortex-realtime@$PLUGIN_VERSION version 2>/dev/null; then
            echo "plugin_already_published=true" >> $GITHUB_OUTPUT
          else
            echo "plugin_already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish plugin to npm
        if: steps.version_check.outputs.already_published == 'false' && steps.plugin_version_check.outputs.plugin_already_published == 'false'
        run: cd plugins/openclaw && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Verify both packages actually landed on npm at the expected version,
      # AND that the plugin tarball has the shape OpenClaw 2026.5.4+ requires
      # (compiled dist/ + openclaw.hooks in package.json). Catches the
      # silent-publish-skip class of bug we hit in v4.13.0 / v4.13.1 where
      # CI failures earlier in the pipeline silently bypassed plugin publish
      # and left the plugin sub-package on a stale (and broken) version while
      # the main package shipped fine — and the OpenClaw-validator class of
      # bug where the plugin technically published but couldn't be installed.
      # Registry propagation lags metadata by up to 3 min after publish; poll.
      - name: Verify both packages landed on npm at the expected version
        if: steps.version_check.outputs.already_published == 'false'
        env:
          MAIN_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -e
          MAIN=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./plugins/openclaw/package.json').version")
          echo "Expected main:   $MAIN"
          echo "Expected plugin: $PLUGIN"

          # Poll npm until both packages report the expected version (max ~3min).
          # Tarball replication lags published metadata, so poll the published
          # tag too — a missing tarball is the actual blocker for `npm install`.
          for i in $(seq 1 18); do
            MAIN_LATEST=$(npm view shieldcortex@$MAIN version 2>/dev/null || echo "")
            PLUGIN_LATEST=$(npm view @drakon-systems/shieldcortex-realtime@$PLUGIN version 2>/dev/null || echo "")
            if [ "$MAIN_LATEST" = "$MAIN" ] && [ "$PLUGIN_LATEST" = "$PLUGIN" ]; then
              echo "Both packages visible on npm after ${i}0s"
              break
            fi
            echo "Waiting for npm propagation (${i}/18) — main=$MAIN_LATEST plugin=$PLUGIN_LATEST"
            sleep 10
          done

          # Final assertion — fail loudly if anything is still missing.
          MAIN_LATEST=$(npm view shieldcortex@$MAIN version 2>/dev/null || echo "")
          PLUGIN_LATEST=$(npm view @drakon-systems/shieldcortex-realtime@$PLUGIN version 2>/dev/null || echo "")
          if [ "$MAIN_LATEST" != "$MAIN" ]; then
            echo "::error::Main package not on npm at expected version (got: '$MAIN_LATEST')"
            exit 1
          fi
          if [ "$PLUGIN_LATEST" != "$PLUGIN" ]; then
            echo "::error::Plugin sub-package not on npm at expected version (got: '$PLUGIN_LATEST'). Lockstep broken — main published without plugin."
            exit 1
          fi

          # Pull the just-published plugin tarball and confirm OpenClaw 2026.5.4+
          # will accept it (we hit both of these silently in plugin v4.12.14):
          #   - dist/index.js must be present (validator demands compiled output)
          #   - package.json must declare openclaw.hooks (hook-pack contract)
          mkdir -p /tmp/plugin-verify
          cd /tmp/plugin-verify
          npm pack @drakon-systems/shieldcortex-realtime@$PLUGIN >/dev/null
          TARBALL=$(ls drakon-systems-shieldcortex-realtime-*.tgz | head -1)
          if ! tar -tf "$TARBALL" | grep -q '^package/dist/index\.js$'; then
            echo "::error::Plugin tarball is missing dist/index.js — OpenClaw 2026.5.4 will reject this install"
            exit 1
          fi
          PLUGIN_PKG_HOOKS=$(tar -xOf "$TARBALL" package/package.json | node -e "let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{const p=JSON.parse(d); console.log(JSON.stringify(p.openclaw?.hooks ?? null));})")
          if [ "$PLUGIN_PKG_HOOKS" = "null" ]; then
            echo "::error::Plugin package.json is missing openclaw.hooks — OpenClaw 2026.5.4 will reject this install"
            exit 1
          fi
          echo "Plugin tarball shape OK: dist/index.js present, openclaw.hooks=${PLUGIN_PKG_HOOKS}"

      # Create the GitHub Release immediately after npm publish so a later
      # ClawHub auth failure can't skip it. (Hit this on v4.10.0 — CLAWHUB_TOKEN
      # was stale, Release step was skipped, had to be created manually.)
      - name: Create GitHub Release
        if: steps.version_check.outputs.already_published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ steps.tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ClawHub CLI
        if: steps.version_check.outputs.already_published == 'false' && env.HAS_CLAWHUB_TOKEN == 'true'
        run: npm install -g clawhub

      - name: Publish ShieldCortex skill to ClawHub
        if: steps.version_check.outputs.already_published == 'false' && env.HAS_CLAWHUB_TOKEN == 'true'
        continue-on-error: true
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          clawhub whoami
          clawhub publish ./skills/shieldcortex \
            --slug shieldcortex \
            --name "ShieldCortex" \
            --version "$RELEASE_VERSION" \
            --changelog "Auto-sync from npm publish ${RELEASE_TAG}"

      - name: Skip ClawHub sync (missing token)
        if: steps.version_check.outputs.already_published == 'false' && env.HAS_CLAWHUB_TOKEN != 'true'
        run: echo "⚠️ CLAWHUB_TOKEN secret missing, skipping ClawHub auto-sync"

      - name: Skip publish (already exists)
        if: steps.version_check.outputs.already_published == 'true'
        run: echo "⚠️ Skipping publish - version already exists on npm"
