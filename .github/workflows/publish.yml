name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.4.10)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Require successful CI checks for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.sha;
            const { data } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref,
              per_page: 100,
            });

            const buildChecks = data.check_runs.filter((run) => run.name.startsWith('build-and-test'));
            if (buildChecks.length === 0) {
              core.setFailed(`No CI build-and-test checks found for ${ref}`);
              return;
            }

            const incomplete = buildChecks.filter((run) => run.status !== 'completed' || run.conclusion !== 'success');
            if (incomplete.length > 0) {
              core.setFailed(`CI checks are not green for ${ref}: ${incomplete.map((run) => `${run.name}=${run.conclusion || run.status}`).join(', ')}`);
            }

      - run: npm ci
      - run: cd dashboard && npm ci
      - run: npm run build:all
      - run: npm test

      - name: Check if version already published
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $PACKAGE_VERSION"

          # Check if this version exists on npm
          if npm view shieldcortex@$PACKAGE_VERSION version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already exists on npm"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION not yet published"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.already_published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish (already exists)
        if: steps.version_check.outputs.already_published == 'true'
        run: echo "⚠️ Skipping publish - version already exists on npm"

      - name: Create GitHub Release
        if: steps.version_check.outputs.already_published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
