name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── macOS ────────────────────────────────────────────────────────────────
  # Every other job here runs on Linux, which makes a whole class of defect
  # invisible BY CONSTRUCTION: anything that assumes `/proc` semantics.
  #
  # The case that bought this job: a change replaced `appendFileSync` with an
  # `appendFileNoFollow` whose symlink check called `readlinkSync('/dev/fd/N')`.
  # Correct on Linux, where `/proc/self/fd/N` is a symlink — EINVAL on macOS,
  # where `/dev/fd/N` is not. The failure path returned false, the caller was a
  # bare `return`, and the result was an audit file created with ZERO bytes,
  # exit 0, nothing on stderr. A silently empty audit trail on every Mac in the
  # fleet, on the fail-closed hot path of a security product — and a 1,133-line
  # test suite went green because it only ever ran on Linux.
  #
  # One Node version, not the matrix: this exists to catch PLATFORM defects, and
  # the Node-version axis is already covered on Linux. macOS runners bill at a
  # multiple of Linux minutes, so the dashboard build/lint is deliberately not
  # duplicated here either — it is pure JS and platform-independent.
  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ts

      # The whole suite, because platform assumptions are not confined to the
      # tests that look filesystem-shaped. `hook-audit-write-smoke.test.ts` in
      # particular spawns the real hook as a real process and asserts a row
      # actually landed — the assertion that would have caught the above.
      - name: Test
        run: npm test

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail-fast on plugin-version drift. The OpenClaw plugin sub-package
      # (plugins/openclaw/package.json) MUST be version-bumped in lockstep
      # with the main package on every release — drift here was the silent
      # mode-of-failure behind v4.13.0/v4.13.1 shipping main while the
      # plugin sub-package stayed stuck on broken-on-OpenClaw-2026.5.4
      # 4.12.14. Catching it at CI rather than publish-time means a PR
      # that bumps main without the plugin can't merge.
      - name: Verify plugin version matches main
        run: |
          MAIN=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./plugins/openclaw/package.json').version")
          if [ "$MAIN" != "$PLUGIN" ]; then
            echo "::error::Plugin version drift: main=$MAIN plugin=$PLUGIN. Bump plugins/openclaw/package.json to $MAIN before merging."
            exit 1
          fi
          echo "Plugin version matches main: $MAIN"

      - name: Build
        run: npm run build:ts

      - name: Check dist for ESM-unsafe require()
        run: npm run test:dist

      # #182 — the Action Guard precision gate. Runs the curated corpus of safe
      # vs dangerous command shapes and fails the build on ANY false positive
      # (safe command gated) or false negative (dangerous command allowed). Its
      # own named, fail-fast step so a precision regression is legible in the CI
      # log without reading the full suite. Platform-independent (pure regex
      # classifier), so it runs here on the Linux matrix, not the billed macOS
      # runner. Also covered by `npm test` below — this is the visible gate.
      - name: Guard precision gate (#182 — no Action Guard false positives)
        run: npm run guard:precision -- --planes

      - name: Test
        run: npm test

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Build dashboard
        run: cd dashboard && npm run build

      - name: Lint dashboard
        run: cd dashboard && npm run lint
